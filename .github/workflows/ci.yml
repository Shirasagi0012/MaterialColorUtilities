name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ContinuousIntegrationBuild: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MaterialColorUtilities.slnx

      - name: Build
        run: dotnet build MaterialColorUtilities.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MaterialColorUtilities.Tests/MaterialColorUtilities.Tests.csproj -c Release --no-build --verbosity normal

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MaterialColorUtilities.slnx

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          base_version="$(dotnet msbuild MaterialColorUtilities.Avalonia/MaterialColorUtilities.Avalonia.csproj -getProperty:Version -nologo)"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$base_version" ]]; then
              echo "Tag version $version does not match the package version $base_version."
              exit 1
            fi
          else
            version="${base_version}.ci.${GITHUB_RUN_ID}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $version"

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            dotnet pack MaterialColorUtilities.slnx \
              -c Release \
              --no-restore \
              -p:GeneratePackageOnBuild=false \
              -o artifacts/packages
          else
            dotnet pack MaterialColorUtilities.slnx \
              -c Release \
              --no-restore \
              -p:GeneratePackageOnBuild=false \
              -p:PackageVersion="${{ steps.version.outputs.version }}" \
              -o artifacts/packages
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish NuGet packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages were produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
