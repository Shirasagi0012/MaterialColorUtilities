name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      nuget_user:
        description: NuGet.org username for Trusted Publishing
        default: Shirasagi
        required: true
        type: string

env:
  ContinuousIntegrationBuild: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MaterialColorUtilities.slnx

      - name: Build
        run: dotnet build MaterialColorUtilities.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MaterialColorUtilities.Tests/MaterialColorUtilities.Tests.csproj -c Release --no-build --verbosity normal

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MaterialColorUtilities.slnx

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          base_version="$(dotnet msbuild MaterialColorUtilities.Avalonia/MaterialColorUtilities.Avalonia.csproj -getProperty:Version -nologo)"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$base_version" ]]; then
              echo "Tag version $version does not match the package version $base_version."
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == refs/heads/main ]]; then
            version="$base_version"
          else
            version="${base_version}.ci.g${GITHUB_SHA}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $version"

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]] || \
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == refs/heads/main ]]; then
            dotnet pack MaterialColorUtilities.slnx \
              -c Release \
              --no-restore \
              -p:GeneratePackageOnBuild=false \
              -o artifacts/packages
          else
            dotnet pack MaterialColorUtilities.slnx \
              -c Release \
              --no-restore \
              -p:GeneratePackageOnBuild=false \
              -p:PackageVersion="${{ steps.version.outputs.version }}" \
              -o artifacts/packages
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    needs: pack
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: nuget-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget_user }}

      - name: Push packages in dependency order
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s failglob
          packages=(
            Shirasagi0012.MaterialColorUtilities
            Shirasagi0012.MaterialColorUtilities.Avalonia
          )
          for package in "${packages[@]}"; do
            for package_file in "artifacts/packages/$package".[0-9]*.nupkg; do
              dotnet nuget push "$package_file" \
                --source "https://api.nuget.org/v3/index.json" \
                --api-key "$NUGET_API_KEY" \
                --skip-duplicate
            done
          done
